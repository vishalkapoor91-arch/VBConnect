<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>VB Connect · Vande Bharat Howrah ⇄ New Jalpaiguri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;700&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Serif+Devanagari:wght@500;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
:root{--ink:#14213D;--ink2:#243659;--ivory:#FAF7F0;--paper:#FFFFFF;--saffron:#C47F17;--saffron-d:#8A5A0B;--mute:#5B6475;--line:#E7E1D4;--ok:#1F6B3A;--danger:#A12A1F;
--serif:'Playfair Display',Georgia,serif;--sans:Inter,system-ui,sans-serif}
html[lang=bn]{--serif:'Noto Serif Bengali','Playfair Display',serif;--sans:'Noto Sans Bengali',Inter,sans-serif}
html[lang=hi]{--serif:'Noto Serif Devanagari','Playfair Display',serif;--sans:'Noto Sans Devanagari',Inter,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink2)}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:92px}
header.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:14px 18px calc(12px);display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:'Playfair Display',serif;font-size:22px;letter-spacing:.01em}
.brand em{font-style:italic;color:#F2C26B}
.langs{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.langs button{border:0;background:transparent;color:#E6EAF2;min-height:36px;min-width:44px;border-radius:999px;font-size:13px;cursor:pointer}
.langs button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:600}
.hero{background:linear-gradient(180deg,var(--ink) 0%,#1E3160 100%);color:#fff;padding:22px 20px 30px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#F2C26B;font-weight:600}
.hero h1{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.15;margin:8px 0 10px}
.hero p{color:#D8DEEA;line-height:1.6;margin:0;font-size:15px}
.prog{margin-top:22px}
.track{height:6px;background:rgba(255,255,255,.18);border-radius:3px;position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;background:#F2C26B;border-radius:3px}
.track b{position:absolute;top:-5px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #F2C26B;transform:translateX(-8px)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:#C9D1E0;margin-top:10px}
.next{margin-top:14px;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px}
.next small{color:#C9D1E0;display:block;font-size:12px}
.next strong{font-size:16px}
section.block{padding:22px 18px 4px}
h2.sec{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 4px}
p.secsub{margin:0 0 14px;color:var(--mute);font-size:14px;line-height:1.5}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3{font-family:var(--serif);font-weight:500;font-size:18px;margin:0 0 6px}
.card p{margin:0;color:#3D4556;line-height:1.6;font-size:14.5px}
.meta{font-size:12px;color:var(--mute);margin-top:8px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.hscroll .card{min-width:78%;scroll-snap-align:start;margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:0 14px;min-height:40px;white-space:nowrap;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.track-row{display:flex;gap:14px;align-items:flex-start}
.play{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--saffron-d);font-weight:700;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:0;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.saff{background:#F2C26B;color:#2A1A00}
.btn.full{width:100%}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(10px + env(safe-area-inset-bottom))}
nav.tabs button{border:0;background:none;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mute);cursor:pointer}
nav.tabs button[aria-current=page]{color:var(--ink);font-weight:700}
nav.tabs svg{width:22px;height:22px}
.reader{position:fixed;inset:0;z-index:50;background:var(--ivory);overflow-y:auto}
.reader .bar{position:sticky;top:0;background:var(--ivory);display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.reader article{max-width:620px;margin:0 auto;padding:22px 22px 80px}
.reader h1{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.15;margin:6px 0 12px}
.reader .dek{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink2);line-height:1.5;margin:0 0 18px;padding-bottom:18px;border-bottom:2px solid #F2C26B}
.reader .body p{font-size:17.5px;line-height:1.78;margin:0 0 18px;color:#232A38}
.reader .body p:first-child::first-letter{font-family:'Playfair Display',serif;float:left;font-size:64px;line-height:.9;padding:6px 8px 0 0;color:var(--saffron)}
.reader img.lead{width:100%;border-radius:12px;margin-bottom:18px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.note{background:#FFF6E3;border:1px solid #F0D9A6;color:#5C3D05;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:16px}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed #C9C2B3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:11px;color:var(--mute)}
.stamp.on{border:3px double var(--saffron);color:var(--saffron-d);background:#FFF8EA;transform:rotate(-6deg)}
.stamp.on b{font-family:'Playfair Display',serif;font-size:18px}
.check{display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid var(--line)}
.check input{width:24px;height:24px;accent-color:var(--ink)}
form.f label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
form.f input[type=text],form.f input[type=number],form.f select,form.f textarea,form.f input[type=url]{width:100%;min-height:46px;border:1px solid #CFC8B8;border-radius:10px;padding:10px 12px;background:#fff}
form.f .consent{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:13px;line-height:1.5}
form.f .consent input{width:22px;height:22px;flex:none;margin-top:2px}
.gal{display:flex;flex-direction:column;gap:18px}
.gal figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gal .ph{aspect-ratio:4/3;background:#EFE9DC;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px}
.gal img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
.gal figcaption{padding:14px 16px}
.gal .yr{font-family:'Playfair Display',serif;font-size:28px;color:var(--saffron-d)}
.fan{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fan figure{margin:0;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.fan img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.fan figcaption{padding:8px 10px;font-size:12px;color:var(--mute)}
.staff{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.staff a.call{min-width:48px;min-height:48px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
.lock{min-height:100vh;background:linear-gradient(180deg,#0E1830,#1E3160);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:32px 28px;text-align:left}
.lock h1{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.15;margin:10px 0 14px}
.lock p{color:#D3DAE8;line-height:1.6}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,16,32,.7);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--ivory);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.vid{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
canvas.cert{width:100%;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.15)}
.sim{background:#fff;border:1px dashed var(--saffron);border-radius:12px;padding:10px 12px;margin:12px 18px 0;font-size:12px}
.sim input{width:100%}
.hide{display:none!important}
.quizopt{display:block;width:100%;text-align:left;min-height:48px;border:1px solid var(--line);background:#fff;border-radius:10px;margin:6px 0;padding:10px 12px;cursor:pointer}
.quizopt.right{border-color:var(--ok);background:#EAF5EE}
.quizopt.wrong{border-color:var(--danger);background:#FBEDEB}
.small{font-size:12px;color:var(--mute)}
</style>
</head>

"Lat": 23.2495, "Lng": 87.8695, "Zone": "rarh", "Halt": "N"}, {"Seq": 10, "Code": "KAN", "Name_en": "Khana Jn", "Name_hi": "खाना जं.", "Name_bn": "খানা জং.", "Lat": 23.337, "Lng": 87.77, "Zone": "rarh", "Halt": "N"}, {"Seq": 11, "Code": "GKH", "Name_en": "Guskara", "Name_hi": "गुसकरा", "Name_bn": "গুসকরা", "Lat": 23.493, "Lng": 87.748, "Zone": "rarh", "Halt": "N"}, {"Seq": 12, "Code": "BHP", "Name_en": "Bolpur Santiniketan", "Name_hi": "बोलपुर शांतिनिकेतन", "Name_bn": "বোলপুর শান্তিনিকেতন", "Lat": 23.668, "Lng": 87.693, "Zone": "bolpur", "Halt": "Y"}, {"Seq": 13, "Code": "AMP", "Name_en": "Ahmadpur Jn", "Name_hi": "अहमदपुर जं.", "Name_bn": "আমোদপুর জং.", "Lat": 23.83, "Lng": 87.69, "Zone": "bolpur", "Halt": "N"}, {"Seq": 14, "Code": "SNT", "Name_en": "Sainthia Jn", "Name_hi": "सैंथिया जं.", "Name_bn": "সাঁইথিয়া জং.", "Lat": 23.945, "Lng": 87.68, "Zone": "santhal", "Halt": "N"}, {"Seq": 15, "Code": "RPH", "Name_en": "Rampurhat Jn", "Name_hi": "रामपुरहाट जं.", "Name_bn": "রামপুরহাট জং.", "Lat": 24.172, "Lng": 87.784, "Zone": "santhal", "Halt": "N"}, {"Seq": 16, "Code": "NHT", "Name_en": "Nalhati Jn", "Name_hi": "नलहाटी जं.", "Name_bn": "নলহাটি জং.", "Lat": 24.3, "Lng": 87.82, "Zone": "santhal", "Halt": "N"}, {"Seq": 17, "Code": "PKR", "Name_en": "Pakur", "Name_hi": "पाकुड़", "Name_bn": "পাকুড়", "Lat": 24.635, "Lng": 87.849, "Zone": "santhal", "Halt": "N"}, {"Seq": 18, "Code": "BHW", "Name_en": "Barharwa Jn", "Name_hi": "बरहरवा जं.", "Name_bn": "বারহারোয়া জং.", "Lat": 24.86, "Lng": 87.78, "Zone": "santhal", "Halt": "N"}, {"Seq": 19, "Code": "NFK", "Name_en": "New Farakka Jn", "Name_hi": "न्यू फरक्का जं.", "Name_bn": "নিউ ফরাক্কা জং.", "Lat": 24.82, "Lng": 87.9, "Zone": "gaur", "Halt": "N"}, {"Seq": 20, "Code": "MLDT", "Name_en": "Malda Town", "Name_hi": "मालदा टाउन", "Name_bn": "মালদা টাউন", "Lat": 25.001, "Lng": 88.143, "Zone": "gaur", "Halt": "Y"}, {"Seq": 21, "Code": "BOE", "Name_en": "Barsoi Jn", "Name_hi": "बारसोई जं.", "Name_bn": "বারসই জং.", "Lat": 25.63, "Lng": 87.93, "Zone": "gaur", "Halt": "Y"}, {"Seq": 22, "Code": "KNE", "Name_en": "Kishanganj", "Name_hi": "किशनगंज", "Name_bn": "কিষাণগঞ্জ", "Lat": 26.096, "Lng": 87.952, "Zone": "north", "Halt": "Y"}, {"Seq": 23, "Code": "AUB", "Name_en": "Aluabari Road", "Name_hi": "अलुआबाड़ी रोड", "Name_bn": "আলুয়াবাড়ি রোড", "Lat": 26.33, "Lng": 88.15, "Zone": "north", "Halt": "N"}, {"Seq": 24, "Code": "NJP", "Name_en": "New Jalpaiguri", "Name_hi": "न्यू जलपाईगुड़ी", "Name_bn": "নিউ জলপাইগুড়ি", "Lat": 26.683, "Lng": 88.443, "Zone": "hills", "Halt": "Y"}], "Zones": [{"Zone": "hooghly", "Title_en": "Leaving Howrah by the Chord", "Title_hi": "कॉर्ड लाइन से हावड़ा की विदाई", "Title_bn": "কর্ড লাইনে হাওড়াকে বিদায়", "Desc_en": "Past Liluah, Belur and Bally the train swings west at Dankuni onto the Chord line, the fast straight road to Bardhaman through the green villages of Hooghly district. Morning ragas and Tagore suit this soft first hour.", "Desc_hi": "लिलुआ, बेलूर और बाली के बाद डानकुनी में ट्रेन कॉर्ड लाइन पर मुड़ती है, हुगली ज़िले के हरे गाँवों से होकर बर्धमान तक का सीधा, तेज़ रास्ता। यह पहला घंटा सुबह के रागों और रवीन्द्र संगीत का है।", "Desc_bn": "লিলুয়া, বেলুড় আর বালি পেরিয়ে ডানকুনিতে ট্রেন বাঁক নেয় কর্ড লাইনে, হুগলি জেলার সবুজ গ্রামের মধ্যে দিয়ে বর্ধমানের সোজা, দ্রুত পথ। এই প্রথম ঘণ্টায় ভোরের রাগ আর রবীন্দ্রসংগীতই মানায়।", "Title_up_en": "Home to the Hooghly", "Title_up_hi": "घर, हुगली की ओर", "Title_up_bn": "ঘরে ফেরা, হুগলির দিকে", "Desc_up_en": "Off the Chord at Dankuni, through Bally, Belur and Liluah, and into Howrah, the red gateway on the river. The journey that began among the hills ends where the railway of the east began in 1854.", "Desc_up_hi": "डानकुनी में कॉर्ड लाइन से उतरकर, बाली, बेलूर और लिलुआ होते हुए, नदी किनारे के लाल द्वार हावड़ा में। पहाड़ों से शुरू हुई यात्रा वहाँ पूरी होती है जहाँ 1854 में पूर्व की रेल शुरू हुई थी।", "Desc_up_bn": "ডানকুনিতে কর্ড লাইন ছেড়ে, বালি, বেলুড় আর লিলুয়া পেরিয়ে, নদীর ধারের লাল তোরণ হাওড়ায়। পাহাড়ে শুরু হওয়া যাত্রা শেষ হয় সেখানে, যেখানে ১৮৫৪ সালে পূর্বের রেলপথের শুরু।"}, {"Zone": "rarh", "Title_en": "The Rice Bowl of Bardhaman", "Title_hi": "बर्धमान का धान का कटोरा", "Title_bn": "বর্ধমানের ধানের গোলা", "Desc_en": "Green paddy runs to the horizon. This is the old Rarh country, land of the Maharajas of Bardhaman and of sweets named after goddesses.", "Desc_hi": "हरा धान क्षितिज तक फैला है। यह पुराना राढ़ अंचल है, बर्धमान के महाराजाओं और सीताभोग-मिहिदाना की धरती।", "Desc_bn": "দিগন্ত পর্যন্ত সবুজ ধান। এ পুরনো রাঢ়ভূমি, বর্ধমানের মহারাজাদের আর সীতাভোগ-মিহিদানার দেশ।"}, {"Zone": "bolpur", "Title_en": "Tagore’s Country", "Title_hi": "टैगोर का देश", "Title_bn": "রবীন্দ্রনাথের দেশ", "Desc_en": "Red laterite soil, khoai ravines and the song of the wandering Bauls. Santiniketan lies a short ride from Bolpur station.", "Desc_hi": "लाल मिट्टी, खोयाई के कटाव और घुमंतू बाउलों का गीत। बोलपुर स्टेशन से शांतिनिकेतन कुछ ही दूर है।", "Desc_bn": "লাল মাটি, খোয়াই আর পথচারী বাউলের গান। বোলপুর স্টেশন থেকে শান্তিনিকেতন অল্প পথ।"}, {"Zone": "santhal", "Title_en": "Drums of the Santhal Land", "Title_hi": "संथाल धरती की थाप", "Title_bn": "সাঁওতাল ভূমির মাদল", "Desc_en": "From Sainthia to Pakur the land darkens and rises towards the Rajmahal hills. This is the home of Santhali song, carried on the tamak and tumdak drums.", "Desc_hi": "सैंथिया से पाकुड़ तक धरती गहरी होकर राजमहल पहाड़ियों की ओर उठती है। यह संथाली गीतों का घर है, जो तमाक और तुमदाक की थाप पर चलते हैं।", "Desc_bn": "সাঁইথিয়া থেকে পাকুড় পর্যন্ত মাটি গাঢ় হয়ে রাজমহল পাহাড়ের দিকে ওঠে। এ সাঁওতালি গানের ঘর, তামাক আর টুমদাকের তালে।"}, {"Zone": "gaur", "Title_en": "The Old Capitals by the Ganga", "Title_hi": "गंगा किनारे की प्राचीन राजधानियाँ", "Title_bn": "গঙ্গার ধারে প্রাচীন রাজধানী", "Desc_en": "Over Farakka and into Malda, where the ruins of Gaur and Pandua stand among mango orchards, and where Gambhira, Malda’s own folk theatre, still sings of the year gone by.", "Desc_hi": "फरक्का पार कर मालदा, जहाँ आम के बागों के बीच गौड़ और पांडुआ के खंडहर खड़े हैं, और जहाँ मालदा का अपना लोकनाट्य गंभीरा आज भी बीते साल को गाता है।", "Desc_bn": "ফরাক্কা পেরিয়ে মালদা, আমবাগানের মাঝে গৌড় আর পাণ্ডুয়ার ধ্বংসাবশেষ, আর মালদার নিজস্ব লোকনাট্য গম্ভীরা আজও গেয়ে যায় পেরিয়ে আসা বছরের কথা।"}, {"Zone": "north", "Title_en": "Songs of the Northern Rivers", "Title_hi": "उत्तर की नदियों के गीत", "Title_bn": "উত্তরের নদীর গান", "Desc_en": "The plains open wide towards North Bengal, the country of Bhawaiya, songs of rivers, longing and the bullock cart road.", "Desc_hi": "मैदान उत्तर बंगाल की ओर खुलते हैं, भावइया का देश, जहाँ नदियों, विरह और बैलगाड़ी की राहों के गीत गाए जाते हैं।", "Desc_bn": "সমতল খুলে যায় উত্তরবঙ্গের দিকে, ভাওয়াইয়ার দেশ, নদী, বিরহ আর গরুর গাড়ির পথের গান।"}, {"Zone": "hills", "Title_en": "Within Sight of the Snows", "Title_hi": "हिमालय की झलक", "Title_bn": "হিমালয়ের দেখা", "Desc_en": "A faint blue line on the northern sky. New Jalpaiguri hands you to the Teesta, the tea gardens and the hills. Nepali and Lepcha folk songs welcome you.", "Desc_hi": "उत्तरी आकाश पर एक हल्की नीली रेखा। न्यू जलपाईगुड़ी आपको तीस्ता, चाय बागानों और पहाड़ों को सौंपता है। नेपाली और लेप्चा लोकगीत आपका स्वागत करते हैं।", "Desc_bn": "উত্তরের আকাশে হালকা নীল রেখা। নিউ জলপাইগুড়ি আপনাকে তুলে দেয় তিস্তা, চা-বাগান আর পাহাড়ের হাতে। নেপালি আর লেপচা লোকগান আপনাকে স্বাগত জানায়।", "Title_up_en": "Farewell to the Snows", "Title_up_hi": "हिमालय को विदा", "Title_up_bn": "হিমালয়কে বিদায়", "Desc_up_en": "The blue line of the Himalaya stays on the northern sky behind you for a little while. New Jalpaiguri sends you south from the Teesta and the tea gardens towards the river and the sea. Nepali and Lepcha songs see you off.", "Desc_up_hi": "हिमालय की नीली रेखा कुछ देर पीछे उत्तरी आकाश पर बनी रहती है। न्यू जलपाईगुड़ी आपको तीस्ता और चाय बागानों से दक्षिण की ओर, नदी और समुद्र की ओर भेजता है। नेपाली और लेप्चा गीत आपको विदा करते हैं।", "Desc_up_bn": "হিমালয়ের নীল রেখা কিছুক্ষণ পিছনে উত্তরের আকাশে থেকে যায়। নিউ জলপাইগুড়ি আপনাকে তিস্তা আর চা-বাগ es after an early start.", "Desc_hi": "हिमालय के हाथ से गढ़े कटोरों की लंबी गूँज। जल्दी की सुबह के बाद आँखें मूँद लें।", "Desc_bn": "হিমালয়ের হাতে-পেটানো বাটির দীর্ঘ গুঞ্জন। ভোরে ওঠার পর চোখ বুজে শুনুন।", "YouTubeId": "", "Query": "Tibetan singing bowls meditation"}, {"Id": "m6", "Category": "ragas", "Zone": "", "Title_en": "Raga Ahir Bhairav", "Artist": "Pt. Hariprasad Chaurasia", "Desc_en": "A dawn raga on the bamboo flute, made for the blue hour as the train leaves Howrah.", "Desc_hi": "बांसुरी पर भोर का राग, हावड़ा से छूटती ट्रेन के नीले पहर के लिए।", "Desc_bn": "বাঁশিতে ভোরের রাগ, হাওড়া ছেড়ে যাওয়ার নীল প্রহরের জন্য।", "YouTubeId": "", "Query": "Hariprasad Chaurasia Raga Ahir Bhairav"}, {"Id": "m7", "Category": "ragas", "Zone": "", "Title_en": "Raga Lalit", "Artist": "Pt. Bhimsen Joshi", "Desc_en": "The raga of the moment night turns into day, sung by one of India’s greatest voices.", "Desc_hi": "वह राग जब रात दिन में बदलती है, भारत की महानतम आवाज़ों में से एक में।", "Desc_bn": "রাত যখন দিনে মেশে সেই মুহূর্তের রাগ, ভারতের অন্যতম শ্রেষ্ঠ কণ্ঠে।", "YouTubeId": "", "Query": "Bhimsen Joshi Raga Lalit"}, {"Id": "m8", "Category": "rabindra", "Zone": "hooghly", "Title_en": "Ekla Chalo Re", "Artist": "Rabindranath Tagore", "Desc_en": "If no one answers your call, walk on alone. Written in 1905, the year Howrah’s great station opened, it became a song of courage for the whole nation.", "Desc_hi": "यदि कोई तुम्हारी पुकार न सुने, तो अकेले चलो। 1905 में लिखा गया, जिस वर्ष हावड़ा का भव्य स्टेशन खुला, यह पूरे देश के साहस का गीत बना।", "Desc_bn": "তোমার ডাক শুনে কেউ না এলে একলা চলো। ১৯০৫ সালে লেখা, যে বছর হাওড়ার নতুন স্টেশন খুলল, এ গান হয়ে উঠল সারা দেশের সাহসের গান।", "YouTubeId": "", "Query": "Ekla Chalo Re Rabindra Sangeet"}, {"Id": "m9", "Category": "rabindra", "Zone": "hooghly", "Title_en": "Amaro Porano Jaha Chay", "Artist": "Rabindranath Tagore", "Desc_en": "A song of devotion and tenderness, among the most loved in the Tagore canon.", "Desc_hi": "समर्पण और कोमलता ption_en": "14 April 1952: the Eastern Railway is formed, with Howrah among its founding divisions.", "Caption_hi": "14 अप्रैल 1952: पूर्व रेलवे का गठन, हावड़ा इसके संस्थापक मंडलों में।", "Caption_bn": "১৪ এপ্রিল ১৯৫২: পূর্ব রেলের গঠন, হাওড়া তার প্রতিষ্ঠাতা বিভাগগুলির একটি।", "ImageFileId": "", "Credit": "", "Order": 3, "Active": "Y"}, {"Id": "g4", "Year": "1969", "Title_en": "The first Rajdhani", "Title_hi": "पहली राजधानी", "Title_bn": "প্রথম রাজধানী", "Caption_en": "3 March 1969: India’s first Rajdhani Express departs Howrah for New Delhi.", "Caption_hi": "3 मार्च 1969: भारत की पहली राजधानी एक्सप्रेस हावड़ा से नई दिल्ली रवाना।", "Caption_bn": "৩ মার্চ ১৯৬৯: দেশের প্রথম রাজধানী এক্সপ্রেস হাওড়া থেকে নয়াদিল্লির পথে।", "ImageFileId": "", "Credit": "", "Order": 4, "Active": "Y"}, {"Id": "g5", "Year": "2005", "Title_en": "A hundred years of the building", "Title_hi": "भवन के सौ वर्ष", "Title_bn": "ভবনের শতবর্ষ", "Caption_en": "The station building turns one hundred. Eastern Railway marks it with the book ‘Vibrant Edifice’.", "Caption_hi": "स्टेशन भवन के सौ वर्ष। पूर्व रेलवे ने ‘वाइब्रेंट एडिफ़िस’ पुस्तक से इसे मनाया।", "Caption_bn": "স্টেশন ভবনের একশো বছর। পূর্ব রেল উদ্‌যাপন করে ‘ভাইব্র্যান্ট এডিফিস’ বই দিয়ে।", "ImageFileId": "", "Credit": "", "Order": 5, "Active": "Y"}, {"Id": "g6", "Year": "2024", "Title_en": "Under the river", "Title_hi": "नदी के नीचे", "Title_bn": "নদীর নিচে", "Caption_en": "Howrah joins India’s first underwater metro, running beneath the Hooghly.", "Caption_hi": "हावड़ा भारत की पहली अंडरवॉटर मेट्रो से जुड़ा, जो हुगली के नीचे चलती है।", "Caption_bn": "হাওড়া যুক্ত হল দেশের প্রথম জলের নিচের মেট্রোয়, হুগলির তলা দিয়ে।", "ImageFileId": "", "Credit": "", "Order": 6, "Active": "Y"}], "Staff": [{"Date": "", "Train": "", "Role": "Train Manager", "Name": "[Name]", "Mobile": "[Mobile]", "Coach": ""}, {"Date": "", "Train": "", "Role": "TTE / Ticket Checking", "Name": "[Name]", "Mobile": "[Mobile]", "Coach": "C1–C8"}, {"Date": "", "Train": "", "Role": "Coach Attendant / OBHS", "Name": "[Name]", "Mobile": "[Mobile]", "Coach": ""}, {"Date": "", "Train": "", "Role": "Electrical (AC / lights)", "Name": "[Name]", "Mobile": "[Mobile]", "Coach": ""}, {"Date": "", "Train": "", "Role": "RPF Escort", "Name": "[Name]", "Mobile": "[Mobile]", "Coach": ""}], "Articles": [{"Id": "a_blue", "Category": "journey", "Order": 1, "ReadMin": 7, "Active": "Y", "ImageFileId": "", "Title_en": "The Blue Hour to the Blue Hills", "Title_hi": "", "Title_bn": "", "Dek_en": "A single morning carries you from the Hooghly to the Himalaya, and along the way the oldest railway in the east travels beside the newest.", "Dek_hi": "", "Dek_bn": "", "Body_en": "There is an hour before a Bengal dawn when the sky is neither dark nor light. The river breathes a soft silver mist across Howrah, and the great station begins to stir beneath its high iron roof. On one of the platforms a long train is waiting, dressed in saffron and grey, calm and sure of itself, humming quietly like something that already knows the way. This is the blue hour, and the Vande Bharat is about to make a promise it means to keep to the minute.\n\nThe rails beneath it remember an older kind of wonder. When the very first passenger train in eastern India ran from Howrah to Hooghly, it covered the whole distance in barely ninety minutes. One traveller on board, so the story goes, simply refused to believe he had arrived so soon. In his world, distance was something you felt in tired feet and weary bullocks. It could not just melt away beneath a pair of iron wheels. That morning, three thousand people had asked for a seat, ten times more than the train could carry, because everyone wanted to feel what it was like when time itself seemed to fold. Almost two centuries later, that same wonder is still here. Only now it runs the other way. How can so much country be folded into a single morning, and folded so gently?\n\nThe answer begins the moment the train pulls away. There is no jerk and no lurch, only a smooth gathering of speed as the platform slips behind. Within minutes the Hooghly falls away from the window, and yet it does not really leave you. It travels on inside you, wide and unhurried, the way the voice of someone dear stays with you long after you have waved goodbye. For this is a river that has kept Bengal company for centuries, and it keeps yours too, all the way to the hills. Long before any rail was laid, this river was the road that built the city. Boats came upstream on the tide with their cargo, and when the railway finally arrived, it did not defeat the river. It made friends with it, and carried its grain, its jute and its coal into a countryside that no boat could reach. Inside the cool, sealed coach, the world outside becomes a silent film of paddy fields and palm trees, while the coffee on your tray barely trembles.\n\nWhere the suburbs thin out, the country of the marketplace begins. Bardhaman has always been a place where roads and grain and travellers meet, and here the railway once did something quieter than simply carrying goods. It changed the way people kept time. A printed timetable slowly taught a whole society to live by an hour that would wait for no one. The train you are riding still honours that hour, and it does so through a great deal of care that you never see: a driver’s steady hand, a signal watched over through the night, a gang of workers who have already walked the track in the dark so that your morning can pass without a single alarm. The finest railwaymen are known by the things that do not happen, and the smoothness of this journey is their quiet signature.\n\nAt Bolpur the mood softens, and the mind slows down even though the train does not. This is the doorway to Santiniketan, to Rabindranath Tagore and to his dream of learning in the open air, in a school without walls, where the changing season was itself a part of the lesson. The railway did not create that dream, but it brought people towards it, and it carried the dream outward, until a small country station in Birbhum became a gateway to poetry, to music and to a gentler idea of what a nation might be.\n\nA little further north, the journey turns from learning to faith. The line runs past Rampurhat, the gateway to the temple town of Tarapith, and here the railway worked its softest miracle. A pilgrimage had once been a hardship that only the wealthy could afford, a matter of many weeks and much suffering on the road. The train made it as simple as buying a ticket and travelling through a single night. Then the land itself begins to darken and rise. The ancient Rajmahal hills gather along the horizon, and near Pakur the earth gives up its black stone to the quarries. From here, this railway division sends its stone across the country, the crushed rock that is packed beneath the tracks and bridges to hold them steady. There is a quiet irony in it. The very chips of stone that steady the rails beneath your wheels may once have been a hillside near Pakur. A country is built not only from the monuments that everyone photographs, but also from the foundations that nobody ever notices.\n\nNot every treasure of this railway division lies along the line you are travelling. Away to the west, where the Bhagirathi river loops through the old heart of Bengal, lie the river towns that the same division still looks after. There is Azimganj, whose merchant families once counted the wealth of an empire, and whose quiet lanes still seem to hold the faint scent of silk. There is Katwa, standing where two rivers meet, once a busy grain port and the resting place of saints. And behind them stands the memory of Murshidabad, a great capital in the days before the railways, when rivers were the only roads, and a single shifting stream of the Ganga could raise up one town and abandon another almost overnight. The railway slowly redrew the map that the water had drawn, and near Malda, among the ruins of Gour, you pass the bones of a medieval capital that the river first made and later left behind.\n\nNow the land tilts upward for the last time. Beyond Barsoi and Kishanganj the flatness loosens its hold, the light turns clear and high, and by early afternoon a faint blue line appears along the northern sky. It is the Himalaya, and it has been waiting there all morning. At New Jalpaiguri the delta finally hands you over to the mountains, to the Teesta river and the tea gardens, to Darjeeling and the Dooars and the long green road into the Northeast. The blue hour that began beside a river ends within sight of the snows.\n\nPeople call this a train of the future, and in many ways it is. It was designed and built in India, in a country that once had to bring its very first engines from across the sea, and that now builds its own and sends them gliding at speed. Yet its swiftness is a careful and disciplined thing. Kavach, India’s own train protection system, already keeps watch over the Howrah, Bardhaman and Khana section, reading the signals ahead and ready to slow a train gently should a human hand ever falter, and it will soon guard the rest of this route as well. And every time the train brakes, it returns part of its energy to the line instead of wasting it, so that a train this fast is also a thrifty one. In every coach there travels a quiet pride, the pride of a people who have learned to make what they ride.\n\nAnd yet, if you watch the window long enough, the real truth arrives with the tea. The newest thing on this line is moving through one of the oldest railway stories in the world. Its speed belongs to our own century, but the ground beneath it belongs to surveyors and poets, to quarry workers and pilgrims and merchants, and to generations of railwaymen whose labour still lies beneath every kilometre of track. That is the quiet secret of the railways, and it is worth carrying home from a single morning spent between the river and the hills. They never really leave history behind. They only reach it a little sooner.", "Body_hi": "", "Body_bn": "", "Dir": "down"}, {"Id": "a_return", "Category": "journey", "Order": 2, "ReadMin": 7, "Active": "Y", "ImageFileId": "", "Dir": "up", "Title_en": "The Hills Hand You Home", "Title_hi": "", "Title_bn": "", "Dek_en": "From the snows to the river in a single evening, a journey that ends where the railway of the east began.", "Dek_hi": "", "Dek_bn": "", "Body_en": "There is a moment at New Jalpaiguri, late in the afternoon, when the light turns gold and the mountains seem to step back a little, as if to watch you leave. The air still carries the cool breath of the hills and the faint green scent of the tea gardens. On the platform the train waits in saffron and grey, quiet and ready. Somewhere to the north the Teesta is running down from the snows on its own long journey to the plains, and in a few minutes you will begin yours.\n\nThe Vande Bharat moves off so gently that you almost miss the moment. The town slips away, the foothills soften into a blue haze, and the land opens out wide and flat towards the south. For a while, if you look back, the Himalaya is still there, a pale line resting on the sky. Then it fades, the way a mountain always does, not all at once but slowly, until you are no longer sure whether you are seeing it or only remembering it. Perhaps that is the best way to leave the hills. You do not lose them. You simply begin to carry them.\n\nThe country that follows is gentle and green. Past Kishanganj and Barsoi the fields stretch to the horizon, broken only by a pond, a clump of bamboo or a village path with a bicycle moving slowly along it. This is the land of Bhawaiya, the old songs of North Bengal, sung by bullock cart drivers on long roads, full of rivers and longing. Listen to one as the light begins to lower, and you will understand why people here have always sung while travelling. A journey is a kind of song. It has a beginning, a middle and a place it is trying to reach.\n\nBy the time the train draws into Malda, evening has begun to gather. Somewhere beyond the station, among the mango orchards, stand the ruins of Gaur and Pandua, once great capitals of Bengal, now quiet arches open to the sky. At this hour their red bricks glow as if they still remember the fires of a thousand kitchens. They are a gentle reminder that cities rise and fall with the rivers that feed them, and that the only thing that truly lasts is the road that keeps people moving between them.\n\nAnd then comes the river itself. At Farakka the train crosses the Ganga, and in the last light of the day the water spreads out on both sides, silver and enormous, so wide that the far bank is only a darker line. This is the river that has carried pilgrims, poets and traders for thousands of years. Here it is held and guided, part of its water sent south to keep the Hooghly alive. In a few hours you will meet that same water again at Howrah. The river is travelling home with you.\n\nNight falls softly over the Santhal country. Beyond Pakur and Rampurhat the land darkens into low hills and quiet villages, where a single lamp in a doorway can feel like a greeting. Inside the coach the lights are warm and the hum of the wheels is steady. Some passengers sleep, some read, some simply watch their own reflections floating over the dark fields. It is a good hour for thinking. Few things are as peaceful as moving swiftly through a sleeping country, knowing that you are safe.\n\nThat safety is not an accident. Out in the dark, people are awake for you. A loco pilot watches each signal as it rises out of the night, calling it aloud with his assistant. A station master clears the way ahead. Somewhere a gateman stands by a closed road with his lamp, and far away in Howrah a controller follows your train across a glowing board, minute by minute. The best railwaymen are known by the things that do not happen, and a calm night journey is their quiet gift to every passenger on board.\n\nAt Bolpur the night takes on a different colour. This is Tagore’s country, and even in the dark it seems to breathe a little music. Tagore wrote many songs for the evening, for the hour when the day’s work is done and the heart turns towards home. Play one now, if you like. There is something deeply right about hearing them here, in the land where they were born, while the train carries you on through the red earth that he loved.\n\nPast Bardhaman the line runs straighter and faster, and the train settles into its finest stride. From Khana onwards, Kavach, India’s own train protection system, keeps watch over the last stretch to Howrah, reading the signals ahead and ready to act should a human hand ever falter. It already guards this busy section, and soon it will guard the rest of the route as well. You will never see it working. That is exactly how it should be.\n\nThen, almost before you expect it, the lights begin. A few at first, then many, then a whole glowing city spreading out beyond the window. At Dankuni the train leaves the Chord and turns towards the river. Bally, Belur and Liluah slide past, and suddenly you can feel the presence of the Hooghly again, broad and dark and patient, as if it has been waiting for you all along.\n\nThe train slows beneath the high roofs of Howrah, the same station where the first train of eastern India set out in 1854. Outside, the great bridge is lit against the night sky, and the river keeps flowing quietly beneath it, as it always has. You step down onto the platform carrying a little of everything you passed: the cool of the hills, the gold of the Malda evening, the silver of the Ganga, the music of Bolpur. The journey has ended where all journeys in the east once began. And that, perhaps, is the real gift of the railway. It does not only take you away. It always knows the way back home.", "Body_hi": "", "Body_bn": ""}, {"Id": "a_howrah", "Category": "journey", "Order": 3, "ReadMin": 6, "Active": "Y", "ImageFileId": "", "Title_en": "Howrah: The Red Gateway on the River", "Title_hi": "हावड़ा: नदी किनारे का लाल द्वार", "Title_bn": "হাওড়া: নদীর ধারে লাল তোরণ", "Dek_en": "It began as a tin shed and a ticket window. It became the busiest gateway of eastern India.", "Dek_hi": "शुरुआत एक टीन के शेड और टिकट खिड़की से हुई। आज यह पूर्वी भारत का सबसे व्यस्त द्वार है।", "Dek_bn": "শুরু হয়েছিল একটা টিনের চালা আর টিকিট জানালা দিয়ে। আজ সে পূর্ব ভারতের ব্যস্ততম দরজা।", "Body_en": "Stand on the far bank of the Hooghly at sunset and look across. A long red building rises from the water’s edge, its towers catching the last of the light, its great clocks keeping watch over a river that has seen empires come and go. Millions of people pass through it every year without a second glance. Yet few buildings in India have carried as much of the country’s story on their shoulders as Howrah station.\n\nThe story begins in 1845, when the East Indian Railway Company was formed in London with a bold idea: to join Calcutta to the coalfields of Bardhaman and, one day, to Delhi itself. The engineers chose Howrah, on the western bank, because the river was too wide to bridge at the time. In October 1852 four builders sent in their prices for a station, ranging from about one lakh ninety thousand to two lakh seventy-five thousand rupees. What finally rose was modest: a single line, a single platform, a ticket counter and a shed.\n\nOn the morning of 15 August 1854, the first train left that shed for Hooghly, twenty-four miles up the river, stopping at Bally, Serampore and Chandernagore. The crowds were enormous, the wonder even greater, and from that day regular passenger services never stopped. Howrah had become the door through which eastern India would walk into the railway age.\n\nThe door soon proved far too small. Lines pushed north and west, and in 1900 the Bengal Nagpur Railway brought its own line into Howrah from the west. In 1901 the decision was taken to build a new station worthy of the traffic. The design went to Halsey Ricardo, a British architect known for his love of colour and craft. He prepared dozens of careful ink drawings, every elevation and floor plan worked out by hand, and Eastern Railway still treasures those sketches today.\n\nRicardo’s station opened to the public on 1 December 1905. It had six platforms, with room left for four more, and it was finished by 1911. The building he gave the city is a blend of Romanesque solidity and Indian warmth: heavy arches, tall towers, deep red brick and those famous clocks, set so that every hurrying traveller can see how much time is left. Later, the Howrah Bridge rose beside it in 1943, and the two together became the picture that most people carry in their minds when they think of Kolkata.\n\nIndependence brought new owners and new ambitions. On 14 April 1952 the Eastern Railway was formed, and Howrah became one of its founding divisions. On 3 March 1969 the first Rajdhani Express in India left Howrah for New Delhi, the beginning of a new era of fast, long-distance travel. In 2005 the building turned one hundred, and Eastern Railway marked the occasion with a book called Vibrant Edifice, telling the saga of the station. A year later the Rail Museum opened next door, so that the old engines that built this story could rest where it began.\n\nToday the station has grown into a city of its own, with an old complex and a new one and twenty-three platforms, the largest train-handling capacity of any station in the country. It was among the first stations in a metropolitan city to be rated as a green building. And in 2024 Howrah did something its first engineers could never have imagined: it went under the river, joining India’s first underwater metro beneath the Hooghly.\n\nSo when your Vande Bharat glides out from beneath these old roofs, remember what you are leaving. A shed became a station, the station became a landmark, and the landmark became a gateway for an entire region. You are not just starting a journey. You are joining one that has been running here, without a pause, since 1854.", "Body_hi": "सूर्यास्त के समय हुगली के उस पार खड़े होकर देखिए। पानी के किनारे से एक लंबी लाल इमारत उठती है, उसकी मीनारें आख़िरी रोशनी पकड़ती हैं और उसकी बड़ी घड़ियाँ उस नदी पर पहरा देती हैं जिसने साम्राज्यों को आते-जाते देखा है। हर साल करोड़ों लोग यहाँ से गुज़रते हैं, फिर भी बहुत कम इमारतों ने देश की कहानी को हावड़ा स्टेशन जितना अपने कंधों पर उठाया है।\n\nकहानी 1845 में शुरू होती है, जब लंदन में ईस्ट इंडियन रेलवे कंपनी बनी। सपना था कलकत्ता को बर्धमान की कोयला खदानों से और आगे चलकर दिल्ली से जोड़ने का। नदी तब पुल के लिए बहुत चौड़ी थी, इसलिए पश्चिमी तट पर हावड़ा चुना गया। अक्टूबर 1852 में स्टेशन बनाने के चार प्रस्ताव आए। जो बना वह बहुत साधारण था: एक लाइन, एक प्लेटफ़ॉर्म, एक टिकट खिड़की और एक शेड।\n\n15 अगस्त 1854 की सुबह पहली ट्रेन उसी शेड से 24 मील दूर हुगली के लिए चली, बाली, श्रीरामपुर और चंदननगर में रुकते हुए। भीड़ उमड़ पड़ी, और उसी दिन से यात्री सेवा कभी नहीं रुकी। हावड़ा वह द्वार बन गया जिससे पूर्वी भारत रेल युग में दाख़िल हुआ।\n\nयह द्वार जल्द ही छोटा पड़ गया। 1900 में बंगाल नागपुर रेलवे भी अपनी लाइन हावड़ा ले आई, और 1901 में नए स्टेशन का निर्णय हुआ। इसका नक्शा ब्रिटिश वास्तुकार हैल्सी रिकार्डो ने बनाया, जिन्होंने हाथ से बनाए गए दर्जनों सुंदर रेखाचित्रों में हर हिस्से की योजना तैयार की।\n\nनया स्टेशन 1 दिसंबर 1905 को जनता के लिए खुला, छह प्लेटफ़ॉर्म और चार और की गुंजाइश के साथ। भारी मेहराबें, ऊँची मीनारें, गहरी लाल ईंट और वे मशहूर घड़ियाँ, ताकि हर जल्दी में भागता यात्री समय देख सके। 1943 में बगल में हावड़ा ब्रिज बना, और दोनों मिलकर कोलकाता की पहचान बन गए।\n\n14 अप्रैल 1952 को पूर्व रेलवे बना और हावड़ा इसका संस्थापक मंडल बना। 3 मार्च 1969 को देश की पहली राजधानी एक्सप्रेस हावड़ा से नई दिल्ली के लिए चली। 2005 में इमारत ने सौ वर्ष पूरे किए, और 2006 में पास ही रेल संग्रहालय खुला।\n\nआज 23 प्लेटफ़ॉर्म वाला यह स्टेशन देश में सबसे अधिक ट्रेनें संभालने की क्षमता रखता है। और 2024 में हावड़ा नदी के नीचे भी पहुँच गया, देश की पहली अंडरवॉटर मेट्रो से जुड़कर।\n\nतो जब आपकी वंदे भारत इन पुरानी छतों के नीचे से सरकती है, याद रखिए कि आप किस विरासत से निकल रहे हैं। आप केवल एक यात्रा शुरू नहीं कर रहे, आप उस यात्रा में शामिल हो रहे हैं जो यहाँ 1854 से बिना रुके चल रही है।", "Body_bn": "সূর্যাস্তের সময় হুগলির ওপারে দাঁড়িয়ে তাকান। জলের ধার থেকে উঠে গেছে এক দীর্ঘ লাল ভবন, তার মিনারে শেষ আলো, আর তার বড় ঘড়িগুলি পাহারা দেয় সেই নদীকে, যে সাম্রাজ্যের ওঠা-নামা দেখেছে। প্রতি বছর কোটি মানুষ এখান দিয়ে যায়, তবু খুব কম ভবনই দেশের ইতিহাস হাওড়া স্টেশনের মতো কাঁধে বয়েছে।\n\nগল্পের শুরু ১৮৪৫ সালে, যখন লন্ডনে তৈরি হল ইস্ট ইন্ডিয়ান রেলওয়ে কোম্পানি। স্বপ্ন ছিল কলকাতাকে বর্ধমানের কয়লাখনির সঙ্গে, আর একদিন দিল্লির সঙ্গে জোড়া। নদী তখন সেতুর পক্ষে বড় চওড়া, তাই পশ্চিম পাড়ের হাওড়াকেই বেছে নেওয়া হল। ১৮৫২ সালের অক্টোবরে স্টেশন গড়ার চারটি দরপত্র আসে। যা গড়ে উঠল তা নেহাতই সাদামাটা: একটি লাইন, একটি প্ল্যাটফর্ম, একটি টিকিট জানালা আর একটি চালাঘর।\n\n১৮৫৪ সালের ১৫ আগস্ট সকালে সেই চালা থেকেই প্রথম ট্রেন রওনা দিল ২৪ মাইল দূরের হুগলির পথে, থামল বালি, শ্রীরামপুর আর চন্দননগরে। ভিড় উপচে পড়ল, আর সেদিন থেকে যাত্রী পরিষেবা আর কখনও থামেনি। হাওড়া হয়ে উঠল সেই দরজা, যা দিয়ে পূর্ব ভারত রেলযুগে পা রাখল।\n\nদরজা অচিরেই ছোট হয়ে গেল। ১৯০০ সালে বেঙ্গল নাগপুর রেলওয়েও তাদের লাইন হাওড়ায় আনল, আর ১৯০১ সালে নতুন স্টেশনের সিদ্ধান্ত হল। নকশা করলেন ব্রিটিশ স্থপতি হ্যালসি রিকার্ডো, হাতে আঁকা অজস্র যত্নের রেখাচিত্রে।\n\nনতুন স্টেশন জনসাধারণের জন্য খুলল ১৯০৫ সালের ১ ডিসেম্বর, ছ’টি প্ল্যাটফর্ম আর আরও চারটির জায়গা রেখে। ভারী খিলান, উঁচু মিনার, গাঢ় লাল ইট আর সেই বিখ্যাত ঘড়ি, যাতে প্রতিটি তাড়াহুড়োর যাত্রী সময় দেখে নিতে পারেন। ১৯৪৩ সালে পাশে উঠল হাওড়া ব্রিজ, আর দুজনে মিলে হয়ে উঠল কলকাতার ছবি।\n\n১৯৫২ সালের ১৪ এপ্রিল গঠিত হল পূর্ব রেল, হাওড়া তার প্রতিষ্ঠাতা বিভাগ। ১৯৬৯ সালের ৩ মার্চ দেশের প্রথম রাজধানী এক্সপ্রেস হাওড়া থেকে নয়াদিল্লির পথে ছুটল। ২০০৫ সালে ভবনের শতবর্ষ, আর ২০০৬ সালে পাশেই খুলল রেল মিউজিয়াম।\n\nআজ ২৩টি প্ল্যাটফর্মের এই স্টেশন দেশে সবচেয়ে বেশি ট্রেন সামলানোর ক্ষমতা রাখে। আর ২০২৪ সালে হাওড়া পৌঁছে গেল নদীর নিচেও, দেশের প্রথম জলের তলার মেট্রোয়।\n\nতাই আপনার বন্দে ভারত যখন এই পুরনো ছাদের নিচ দিয়ে বেরিয়ে যায়, মনে রাখবেন আপনি কোন উত্তরাধিকার ছেড়ে যাচ্ছেন। আপনি শুধু একটা যাত্রা শুরু করছেন না, যোগ দিচ্ছেন এমন এক যাত্রায়, যা এখানে ১৮৫৪ থেকে বিরামহীন চলছে।"}, {"Id": "a_signals", "Category": "technology", "Order": 1, "ReadMin": 5, "Active": "Y", "ImageFileId": "", "Title_en": "Red, Yellow, Green: The Quiet Language of Signals", "Title_hi": "लाल, पीला, हरा: सिग्नलों की मौन भाषा", "Title_bn": "লাল, হলুদ, সবুজ: সিগন্যালের নীরব ভাষা", "Dek_en": "How a train running at speed always knows what lies ahead, explained without a single equation.", "Dek_hi": "तेज़ दौड़ती ट्रेन को आगे का रास्ता कैसे पता रहता है, बिना किसी समीकरण के।", "Dek_bn": "দ্রুত ছুটে চলা ট্রেন কীভাবে জানে সামনে কী আছে, কোনও অঙ্ক ছাড়াই।", "Body_en": "A car driver can see the road and stop when something appears. A train cannot. A long train at speed may need well over a kilometre to come to a halt, so the loco pilot must know what is ahead long before he can see it. That knowledge comes from signals, the coloured lights along the track that speak a simple and very strict language.\n\nRed means stop. Never pass it. Yellow means you may go on, but slow down and be ready, because the next signal is red. Two yellow lights, one above the other, mean the next signal will show a single yellow, so begin preparing early. Green means the line is clear for at least two signals ahead, and the train may run at its permitted speed. Every light is a promise about the track beyond it.\n\nOn the busy line from Howrah to Bardhaman, signals change by themselves. This is called automatic block signalling. The track is divided into sections, and electronic sensors called track circuits and axle counters know at every moment whether a section is occupied. When a train enters a section, the signal behind it turns red on its own, protecting it from the train that follows. As it moves on, the signals behind it step down to yellow and then to green, like a wave of permission travelling behind it.\n\nAt stations there is another guardian called interlocking. Points, the moving rails that switch a train from one track to another, are locked together with the signals. A signal cannot show green unless the points are set correctly and locked, and unless no other train can be given a path that crosses it. Today these locks are kept by computers, so the station master cannot clear a dangerous route even by mistake.\n\nAnd then there is Kavach, which means armour. It is India’s own automatic train protection system, designed and built in India. Small tags placed on the track tell the locomotive exactly where it is, and radio towers along the line tell it what the signals ahead are showing. If the loco pilot does not slow down when he should, if a red signal is approaching too fast, or if two trains are heading for the same stretch, Kavach warns him and, if needed, applies the brakes itself. Kavach is already operational on the Howrah, Bardhaman and Khana section of this route, and it will soon cover the other sections on the way to New Jalpaiguri as well.\n\nAbove your head runs one more invisible helper: the overhead wire, carrying 25,000 volts. The pantograph on the roof touches it gently, and motors spread under many coaches turn that power into smooth, quick speed. When the train brakes, those motors work backwards and send electricity back into the wire.\n\nSo the next time you glide past a signal, look at its colour. It is not just a light. It is the voice of thousands of careful people and machines, all saying the same thing to your train: the way ahead is safe.", "Body_hi": "कार चलाने वाला सड़क देखकर रुक सकता है, ट्रेन नहीं। तेज़ रफ़्तार लंबी ट्रेन को रुकने के लिए एक किलोमीटर से भी ज़्यादा दूरी चाहिए, इसलिए लोको पायलट को आगे का हाल देखने से बहुत पहले जानना होता है। यह जानकारी सिग्नल देते हैं, पटरी किनारे की रंगीन बत्तियाँ, जो एक सरल और बेहद सख़्त भाषा बोलती हैं।\n\nलाल का अर्थ है रुको, इसे कभी पार नहीं करना। पीला: आगे बढ़ सकते हैं, पर गति कम करें, क्योंकि अगला सिग्नल लाल है। ऊपर-नीचे दो पीली बत्तियाँ: अगला सिग्नल एक पीला दिखाएगा, पहले से तैयारी करें। हरा: आगे कम से कम दो सिग्नल तक लाइन साफ़ है।\n\nहावड़ा से बर्धमान की व्यस्त लाइन पर सिग्नल अपने आप बदलते हैं। इसे स्वचालित ब्लॉक सिग्नलिंग कहते हैं। पटरी खंडों में बँटी है और ट्रैक सर्किट व एक्सल काउंटर जानते हैं कि कौन सा खंड खाली है। ट्रेन किसी खंड में आते ही उसके पीछे का सिग्नल अपने आप लाल हो जाता है।\n\nस्टेशनों पर इंटरलॉकिंग पहरा देती है। पॉइंट, यानी वह पटरी जो ट्रेन को एक लाइन से दूसरी पर ले जाती है, सिग्नल के साथ बंधे होते हैं। जब तक रास्ता सही और सुरक्षित न हो, सिग्नल हरा नहीं हो सकता। आज यह ताला कंप्यूटर रखते हैं।\n\nऔर फिर है कवच, भारत में बनी स्वचालित ट्रेन सुरक्षा प्रणाली। पटरी पर लगे टैग इंजन को उसकी जगह बताते हैं और रेडियो टावर आगे के सिग्नल की जानकारी देते हैं। अगर लोको पायलट समय पर गति कम न करे, या लाल सिग्नल तेज़ी से पास आ रहा हो, तो कवच चेतावनी देता है और ज़रूरत पड़ने पर ख़ुद ब्रेक लगा देता है। कवच इस मार्ग के हावड़ा – बर्धमान – खाना खंड पर पहले से कार्यरत है, और जल्द ही न्यू जलपाईगुड़ी तक के अन्य खंडों पर भी लगेगा।\n\nआपके सिर के ऊपर 25,000 वोल्ट का तार चलता है। छत पर लगा पैंटोग्राफ़ उसे हल्के से छूता है, और कई कोचों के नीचे लगी मोटरें उस बिजली को तेज़, सहज गति में बदलती हैं। ब्रेक लगने पर यही मोटरें बिजली वापस तार में भेजती हैं।\n\nअगली बार किसी सिग्नल के पास से गुज़रें, तो उसका रंग देखिए। वह सिर्फ़ एक बत्ती नहीं, हज़ारों सजग लोगों और मशीनों की आवाज़ है, जो आपकी ट्रेन से कह रही है: आगे का रास्ता सुरक्षित है।", "Body_bn": "গাড়ির চালক রাস্তা দেখে থামতে পারেন, ট্রেন পারে না। দ্রুতগতির লম্বা ট্রেনের থামতে এক কিলোমিটারেরও বেশি লাগতে পারে, তাই লোকো পাইলটকে সামনে কী আছে তা দেখার অনেক আগেই জানতে হয়। সেই খবর দেয় সিগন্যাল, লাইনের ধারের রঙিন আলো, যারা এক সহজ কিন্তু কঠোর ভাষায় কথা বলে।\n\nলাল মানে থামো, কখনও পেরোনো যাবে না। হলুদ: এগোতে পারো, তবে গতি কমাও, পরের সিগন্যাল লাল। উপর-নিচে দুটো হলুদ: পরের সিগন্যাল একটা হলুদ দেখাবে, আগে থেকে তৈরি হও। সবুজ: সামনে অন্তত দুটো সিগন্যাল পর্যন্ত লাইন পরিষ্কার।\n\nহাওড়া থেকে বর্ধমানের ব্যস্ত লাইনে সিগন্যাল নিজে থেকেই বদলায়। একে বলে স্বয়ংক্রিয় ব্লক সিগন্যালিং। লাইন ভাগ করা আছে নানা অংশে, আর ট্র্যাক সার্কিট ও অ্যাক্সেল কাউন্টার জানে কোন অংশ খালি। ট্রেন কোনও অংশে ঢুকলেই তার পিছনের সিগন্যাল নিজে থেকে লাল হয়ে যায়।\n\nস্টেশনে পাহারা দেয় ইন্টারলকিং। পয়েন্ট, অর্থাৎ যে চলমান লাইন ট্রেনকে এক পথ থেকে অন্য পথে নিয়ে যায়, তা সিগন্যালের সঙ্গে বাঁধা থাকে। পথ ঠিক ও নিরাপদ না হলে সিগন্যাল সবুজ হতেই পারে না। আজ এই তালা রাখে কম্পিউটার।\n\nআর আছে কবচ, ভারতে তৈরি স্বয়ংক্রিয় ট্রেন সুরক্ষা ব্যবস্থা। লাইনে বসানো ছোট ট্যাগ ইঞ্জিনকে জানায় সে কোথায়, আর রেডিও টাওয়ার জানায় সামনের সিগন্যালের খবর। লোকো পাইলট সময়ে গতি না কমালে, বা লাল সিগন্যাল খুব দ্রুত কাছে এলে, কবচ সতর্ক করে, দরকারে নিজেই ব্রেক কষে। এই পথের হাওড়া – বর্ধমান – খানা শাখায় কবচ ইতিমধ্যেই চালু, আর শিগগিরই নিউ জলপাইগুড়ি পর্যন্ত বাকি শাখাতেও বসবে।\n\nমাথার উপর দিয়ে চলেছে ২৫,০০০ ভোল্টের তার। ছাদের প্যান্টোগ্রাফ তাকে আলতো ছোঁয়, আর নানা কোচের নিচের মোটর সেই বিদ্যুৎকে মসৃণ, দ্রুত গতিতে বদলে দেয়। ব্রেক কষলে সেই মোটরই বিদ্যুৎ ফেরত পাঠায় তারে।\n\nপরের বার কোনও সিগন্যাল পেরোনোর সময় তার রং দেখবেন। সে শুধু একটা আলো নয়, হাজারো সজাগ মানুষ আর যন্ত্রের কণ্ঠস্বর, যারা আপনার ট্রেনকে বলছে: সামনের পথ নিরাপদ।"}, {"Id": "a_railmadad", "Category": "help", "Order": 1, "ReadMin": 3, "Active": "Y", "ImageFileId": "", "Title_en": "RailMadad: Help Is One Tap Away", "Title_hi": "रेलमदद: मदद बस एक टैप दूर", "Title_bn": "রেলমদদ: সাহায্য এক ছোঁয়ায়", "Dek_en": "What you can report, how it reaches the people who can fix it, and what happens next.", "Dek_hi": "आप क्या शिकायत कर सकते हैं, वह किन लोगों तक पहुँचती है, और आगे क्या होता है।", "Dek_bn": "কী জানাতে পারেন, তা কাদের কাছে পৌঁছায়, আর তারপর কী হয়।", "Body_en": "Every journey should be a comfortable one. When something is not right, Indian Railways wants to hear about it at once, and RailMadad is the single window built for that purpose.\n\nYou can reach RailMadad in three ways: by calling 139 from any phone, through the RailMadad app, or on the RailMadad website. You do not need to know which department looks after what. Simply tell RailMadad what is wrong.\n\nYou can report almost anything about your journey: a coach that needs cleaning, a toilet without water, an air-conditioner that is too warm or too cold, a light or charging point that is not working, a concern about your safety or the behaviour of a fellow passenger, a medical need, or the conduct of any staff member. Women travelling alone and passengers who need assistance can also ask for help here.\n\nWhen you register a complaint, you receive a reference number at once by SMS. Your complaint does not sit in a queue far away. It is sent straight to the people who can act on it, including the staff travelling on your own train, and the progress is watched by the division until it is closed. You can follow its status with your reference number, and once it is resolved you will be asked how well it was handled.\n\nIn VB Connect, the RailMadad button opens the official service with your train already in mind. For anything urgent, such as a medical emergency or a threat to safety, call 139 straight away, or speak to the Train Manager or RPF staff listed under Onboard Help.\n\nYour feedback is how a railway keeps getting better. Every complaint that is heard and resolved makes the next journey a little smoother for someone else.", "Body_hi": "हर यात्रा आरामदायक होनी चाहिए। जब कुछ ठीक न हो, भारतीय रेल तुरंत जानना चाहती है, और रेलमदद इसी के लिए बना एकल द्वार है।\n\nआप रेलमदद तक तीन तरह से पहुँच सकते हैं: किसी भी फ़ोन से 139 पर कॉल करके, रेलमदद ऐप से, या रेलमदद वेबसाइट पर। आपको यह जानने की ज़रूरत नहीं कि कौन सा विभाग क्या देखता है। बस बताइए कि क्या गड़बड़ है।\n\nआप अपनी यात्रा से जुड़ी लगभग हर बात बता सकते हैं: कोच की सफ़ाई, शौचालय में पानी, एसी का तापमान, बत्ती या चार्जिंग पॉइंट, सुरक्षा की चिंता, चिकित्सा सहायता, या किसी कर्मचारी का व्यवहार। अकेली यात्रा कर रही महिलाएँ और सहायता चाहने वाले यात्री भी यहाँ मदद माँग सकते हैं।\n\nशिकायत दर्ज होते ही आपको SMS से संदर्भ संख्या मिलती है। शिकायत सीधे उन लोगों तक पहुँचती है जो कार्रवाई कर सकते हैं, आपकी ट्रेन के कर्मचारियों समेत, और मंडल उसके बंद होने तक निगरानी रखता है। समाधान के बाद आपसे पूछा जाता है कि काम कैसा हुआ।\n\nकिसी भी आपात स्थिति में, जैसे चिकित्सा या सुरक्षा का ख़तरा, तुरंत 139 पर कॉल करें, या ऑनबोर्ड सहायता में दिए ट्रेन मैनेजर या आरपीएफ़ कर्मचारी से बात करें।\n\nआपकी प्रतिक्रिया से ही रेल बेहतर होती है। हर सुनी और सुलझी शिकायत किसी और की अगली यात्रा थोड़ी और सहज बना देती है।", "Body_bn": "প্রতিটি যাত্রা আরামদায়ক হওয়া উচিত। কিছু ঠিক না থাকলে ভারতীয় রেল তখনই জানতে চায়, আর রেলমদদ তারই জন্য তৈরি একক জানালা।\n\nরেলমদদে পৌঁছনো যায় তিনভাবে: যে কোনও ফোন থেকে ১৩৯-এ ফোন করে, রেলমদদ অ্যাপে, বা রেলমদদ ওয়েবসাইটে। কোন বিভাগ কী দেখে তা জানার দরকার নেই। শুধু বলুন কী সমস্যা।\n\nযাত্রার প্রায় সব কিছুই জানাতে পারেন: কোচ পরিষ্কার, শৌচাগারে জল, এসির তাপমাত্রা, আলো বা চার্জিং পয়েন্ট, নিরাপত্তার উদ্বেগ, চিকিৎসার প্রয়োজন, বা কোনও কর্মীর আচরণ। একা যাত্রা করা মহিলা ও সহায়তা প্রয়োজন এমন যাত্রীরাও এখানে সাহায্য চাইতে পারেন।\n\nঅভিযোগ জানানোর সঙ্গে সঙ্গে SMS-এ একটি নম্বর পাবেন। অভিযোগ সোজা পৌঁছয় তাঁদের কাছে যাঁরা ব্যবস্থা নিতে পারেন, আপনার ট্রেনের কর্মীরাও তার মধ্যে, আর বিভাগ নজর রাখে যতক্ষণ না তা মেটে। সমাধানের পর আপনাকে জিজ্ঞেস করা হবে কাজ কেমন হল।\n\nজরুরি কিছু হলে, যেমন চিকিৎসা বা নিরাপত্তার বিপদ, তখনই ১৩৯-এ ফোন করুন, অথবা অনবোর্ড সাহায্যে দেওয়া ট্রেন ম্যানেজার বা আরপিএফ কর্মীর সঙ্গে কথা বলুন।\n\nআপনার মতামতেই রেল আরও ভাল হয়। প্রতিটি শোনা ও মেটানো অভিযোগ অন্য কারও পরের যাত্রা একটু আরও মসৃণ করে।"}, {"Id": "a_people", "Category": "people", "Order": 1, "ReadMin": 6, "Active": "Y", "ImageFileId": "", "Title_en": "The Hands That Move Your Train", "Title_hi": "वे हाथ जो आपकी ट्रेन चलाते हैं", "Title_bn": "যে হাতে চলে আপনার ট্রেন", "Dek_en": "You will meet a few of them. Most you will never see. Every one of them is on duty for you today.", "Dek_hi": "", "Dek_bn": "", "Body_en": "A train looks like a machine, but it runs on people. Long before you reached the platform this morning, hundreds of them had already started work so that your journey could begin on time.\n\nThe Loco Pilot sits at the very front, watching every signal, every curve and every level crossing. He knows this line the way you know the road to your home, every gradient and every bridge. Beside him, the Assistant Loco Pilot calls out each signal aloud, so that two pairs of eyes confirm every light.\n\nThe Train Manager, once called the guard, travels with you and is responsible for the whole train. If anything goes wrong anywhere on board, the Train Manager is the person in charge, in touch with the loco pilot and with the control office at every moment.\n\nThe Station Master at every station along the way decides which line your train will use and clears the signals for it. At the bigger stations this is done on a glowing computer screen, but the responsibility is the same as it was a century ago: no train moves until the way is safe.\n\nThe Keyman and the trackmen walk the line on foot, often before dawn, hammer in hand, checking every joint, every fastening and every sleeper. They are the reason the coffee in your cup barely ripples at high speed.\n\nThe Gateman stands at a level crossing in the heat and the rain, closing the road so that your train may pass, and the Signal Maintainer keeps the lights, the points and the electronic locks in perfect health. The OHE staff look after the wire above you that carries 25,000 volts, and the electrical staff on board keep your air-conditioning and lights working.\n\nThe Ticket Examiner and the coach attendants look after you in the coach itself, and the RPF escort keeps watch over your safety and your belongings.\n\nAnd far away, in a quiet room in Howrah, sits the Section Controller, who watches every train on the division at once and plans how each one will move, minute by minute, so that yours is not kept waiting.\n\nThe best railwaymen are known by what does not happen. If your journey today is calm, on time and uneventful, that is their work, done well.", "Body_hi": "", "Body_bn": ""}, {"Id": "p_bardhaman", "Category": "places", "Order": 2, "ReadMin": 3, "Active": "Y", "ImageFileId": "", "Title_en": "Bardhaman: Maharajas, Gates and Golden Sweets", "Title_hi": "", "Title_bn": "", "Dek_en": "The capital of Bengal’s rice country, where every visitor leaves carrying a box of sweets.", "Dek_hi": "", "Dek_bn": "", "Body_en": "Bardhaman has been an important town for more than a thousand years, and for centuries it was the seat of the wealthy Maharajas of Bardhaman. Their palace, gardens and temples still give the town a stately air.\n\nThe grand Curzon Gate, also called Bijay Toran, stands across the main road, built to welcome a viceroy at the start of the twentieth century. Nearby are the palace complex, the 108 Shiva temples at Nawabhat, and the old Sarbamangala temple, much loved by the people of the town.\n\nBut ask anyone what Bardhaman is famous for, and the answer comes with a smile: sitabhog and mihidana. Sitabhog looks like fine white grains of rice, sweet and fragrant, while mihidana is made of tiny golden pearls of gram flour fried and soaked in syrup. Both have been granted the Geographical Indication tag, and no visit is complete without them.\n\nHow to visit: Bardhaman Junction is a major station on this line. The town is easy to explore by rickshaw in half a day."}, {"Id": "p_santiniketan", "Category": "places", "Order": 3, "ReadMin": 4, "Active": "Y", "ImageFileId": "", "Title_en": "Santiniketan: The School Under the Trees", "Title_hi": "", "Title_bn": "", "Dek_en": "Tagore’s abode of peace, now a World Heritage Site, a short ride from Bolpur station.", "Dek_hi": "", "Dek_bn": "", "Body_en": "In 1863 Debendranath Tagore found a quiet place under the chhatim trees of Birbhum and called it Santiniketan, the abode of peace. His son Rabindranath turned it into something the world had never seen: a school where children learned in the open air, under the trees, with the changing seasons as part of the lesson. In 1921 it became Visva-Bharati, a university meant to bring the world together in one nest.\n\nWalk through the campus and you will see classes still held outdoors, sculptures by Ramkinkar Baij standing among the trees, and the houses of Uttarayan where Tagore lived and worked. The Rabindra Bhavana museum holds his manuscripts, paintings and the many gifts he received. In 2023, UNESCO inscribed Santiniketan as a World Heritage Site.\n\nThe land around is just as memorable. The red earth folds into the gullies of Khoai, where a weekly market of handicrafts and Baul singers gathers on Saturdays. Kantha embroidery, leather work and dokra metal craft are made in the villages nearby.\n\nIn December comes Poush Mela, the great winter fair, and in spring Basanta Utsav fills the campus with colour, song and dance.\n\nHow to visit: Bolpur Santiniketan is a halt of this Vande Bharat. Santiniketan is a short auto-rickshaw ride from the station. Note that the campus has visiting hours, and Wednesday is the weekly holiday."}, {"Id": "p_birbhum", "Category": "places", "Order": 4, "ReadMin": 3, "Active": "Y", "ImageFileId": "", "Title_en": "Tarapith and the Terracotta of Birbhum", "Title_hi": "", "Title_bn": "", "Dek_en": "Temple towns, hot springs and walls of carved clay near Rampurhat.", "Dek_hi": "", "Dek_bn": "", "Body_en": "Rampurhat is the gateway to Tarapith, one of the most revered temples of the Goddess in Bengal, on the banks of the Dwarka river. Pilgrims come throughout the year, and the town is especially full during the festival days of the autumn.\n\nBirbhum is also a land of wonders in clay. Its villages hold temples whose walls are covered in terracotta panels, telling stories from the Ramayana, the Mahabharata and everyday village life, each tile shaped and fired by hand centuries ago.\n\nNot far away is Bakreshwar, famous for its hot springs, where the water bubbles up warm from the earth beside a cluster of old temples. And to the north begins the country of the Santhals, whose painted mud houses and harvest festivals are among the most beautiful sights of rural Bengal.\n\nHow to visit: Rampurhat Junction is the station for Tarapith, which is a short road journey away."}, {"Id": "p_malda", "Category": "places", "Order": 5, "ReadMin": 4, "Active": "Y", "ImageFileId": "", "Title_en": "Malda: Ruined Capitals Among the Mango Groves", "Title_hi": "", "Title_bn": "", "Dek_en": "Across the Ganga at Farakka lie the bones of two medieval capitals of Bengal.", "Dek_hi": "", "Dek_bn": "", "Body_en": "Just before Malda, your train crosses the Ganga at Farakka, where a great barrage holds the river and guides part of its water towards the Hooghly. Watch for the long sweep of water on both sides. It is one of the grandest views of the whole journey.\n\nBeyond it lies Malda, and hidden among its mango orchards are Gaur and Pandua, two capitals of medieval Bengal. Gaur was one of the great cities of its age, and its ruins are still spread over many miles: the Baro Sona Masjid with its arched halls, the tall Dakhil Darwaza gateway of small red bricks, the Firoz Minar tower and the delicate tiles of the Lattan Masjid. Then the river changed its course, and the city slowly emptied.\n\nAt Pandua stands the Adina Mosque, built in the fourteenth century and once among the largest mosques in the subcontinent. Its endless rows of arches, now open to the sky, are deeply moving at sunset.\n\nMalda is also the mango capital of Bengal. The Fazli, the Himsagar and the Lakshmanbhog ripen here in early summer, and the orchards are a sea of blossom in spring.\n\nHow to visit: Malda Town is a halt of this train. Gaur and Pandua are each a short drive from the town, and winter is the best season."}, {"Id": "p_njp", "Category": "places", "Order": 6, "ReadMin": 3, "Active": "Y", "ImageFileId": "", "Title_en": "New Jalpaiguri: Where the Hills Begin", "Title_hi": "", "Title_bn": "", "Dek_en": "Darjeeling, the Dooars, Sikkim and the Toy Train: your journey has only just begun.", "Dek_hi": "", "Dek_bn": "", "Body_en": "New Jalpaiguri is more than the end of this journey. It is the doorway to some of the most beautiful country in India.\n\nFrom here the Darjeeling Himalayan Railway, the famous Toy Train, climbs from the plains into the clouds on a line built in the 1880s. Its loops, its zigzags and its little blue engines earned it a place on the UNESCO World Heritage list in 1999, the first railway in Asia to be so honoured.\n\nTo the north lie Darjeeling and Kalimpong, with their tea estates and views of Kanchenjunga. To the east stretch the Dooars, a land of forests, rivers and wildlife sanctuaries such as Gorumara and Jaldapara, home of the one-horned rhinoceros. And the road into Sikkim begins here too, along the rushing green Teesta.\n\nHow to continue: taxis, buses and the Toy Train connect NJP to the hills. Mornings are clearest for mountain views, so if Kanchenjunga is on your wish list, rise early tomorrow."}], "KidsSpot": [{"Id": "s1", "Item_en": "A wide river", "Item_hi": "एक चौड़ी नदी", "Item_bn": "একটা চওড়া নদী"}, {"Id": "s2", "Item_en": "A signal showing green", "Item_hi": "हरा सिग्नल", "Item_bn": "সবুজ সিগন্যাল"}, {"Id": "s3", "Item_en": "Paddy fields", "Item_hi": "धान के खेत", "Item_bn": "ধানখেত"}, {"Id": "s4", "Item_en": "A pond with ducks", "Item_hi": "बत्तखों वाला तालाब", "Item_bn": "হাঁস চরা পুকুর"}, {"Id": "s5", "Item_en": "Palm trees in a row", "Item_hi": "कतार में ताड़ के पेड़", "Item_bn": "সারি সারি তালগাছ"}, {"Id": "s6", "Item_en": "A level crossing gate", "Item_hi": "समपार फाटक", "Item_bn": "লেভেল ক্রসিং গেট"}, {"Id": "s7", "Item_en": "A goods train", "Item_hi": "मालगाड़ी", "Item_bn": "মালগাড়ি"}, {"Id": "s8", "Item_en": "Red earth near Bolpur", "Item_hi": "बोलपुर की लाल मिट्टी", "Item_bn": "বোলপুরের লাল মাটি"}, {"Id": "s9", "Item_en": "Hills on the horizon", "Item_hi": "क्षितिज पर पहाड़", "Item_bn": "দিগন্তে পাহাড়"}, {"Id": "s10", "Item_en": "Tea gardens", "Item_hi": "चाय बागान", "Item_bn": "চা-বাগান"}], "KidsStories": [{"Id": "k1", "Title_en": "The Little Signal Who Never Slept", "Title_hi": "वह नन्हा सिग्नल जो कभी नहीं सोया", "Title_bn": "যে ছোট্ট সিগন্যাল কখনও ঘুমোয় না", "Body_en": "Beside the line near Bardhaman lived a little signal named Lal. All night, while the fields slept and the owls called, Lal kept his eye open. When a train had just gone by, he glowed red. ‘Wait,’ he told the next train. ‘Your friend is still ahead.’ When the line was empty again, he blinked yellow, then green. ‘Off you go,’ he whispered. One stormy night the rain beat on his face and the wind shook his pole, but Lal did not close his eye even once. In the morning, the loco pilot of the first Vande Bharat waved at him as she flew past. Lal did not wave back. Signals are not allowed to. But if you look closely at his green light, you might see that it is shining a little brighter than the rest.", "Body_hi": "बर्धमान के पास पटरी के किनारे लाल नाम का एक नन्हा सिग्नल रहता था। सारी रात, जब खेत सोते और उल्लू बोलते, लाल अपनी आँख खुली रखता। जब कोई ट्रेन अभी-अभी गुज़री होती, वह लाल चमकता। ‘रुको,’ वह अगली ट्रेन से कहता, ‘तुम्हारा दोस्त अभी आगे है।’ लाइन खाली होने पर वह पहले पीला, फिर हरा झपकाता। ‘अब जाओ,’ वह फुसफुसाता। एक तूफ़ानी रात बारिश ने उसका चेहरा भिगोया और हवा ने उसका खंभा हिलाया, पर लाल ने एक बार भी आँख नहीं मूँदी। सुबह पहली वंदे भारत की लोको पायलट ने गुज़रते हुए उसे हाथ हिलाया। लाल ने जवाब नहीं दिया, सिग्नलों को इसकी इजाज़त नहीं। पर ध्यान से देखो, तो उसकी हरी बत्ती बाकियों से थोड़ी ज़्यादा चमक रही थी।", "Body_bn": "বর্ধমানের কাছে লাইনের ধারে থাকত লাল নামে এক ছোট্ট সিগন্যাল। সারা রাত, যখন মাঠ ঘুমোত আর পেঁচা ডাকত, লাল চোখ খোলা রাখত। সবে কোনও ট্রেন গেলে সে লাল জ্বলত। ‘দাঁড়াও,’ সে পরের ট্রেনকে বলত, ‘তোমার বন্ধু এখনও সামনে।’ লাইন খালি হলে সে প্রথমে হলুদ, তারপর সবুজ জ্বলত। ‘এবার যাও,’ ফিসফিস করে বলত। এক ঝড়ের রাতে বৃষ্টি তার মুখ ভিজিয়ে দিল, হাওয়া তার খুঁটি নাড়িয়ে দিল, কিন্তু লাল একবারও চোখ বোজেনি। সকালে প্রথম বন্দে ভারতের লোকো পাইলট যাওয়ার সময় তাকে হাত নাড়লেন। লাল হাত নাড়েনি, সিগন্যালদের তা করতে নেই। কিন্তু ভাল করে দেখলে বুঝবে, তার সবুজ আলো সেদিন অন্যদের চেয়ে একটু বেশিই উজ্জ্বল।"}, {"Id": "k2", "Title_en": "The Keyman and the Morning Dew", "Title_hi": "कीमैन और सुबह की ओस", "Title_bn": "কিম্যান আর ভোরের শিশির", "Body_en": "Before the sun came up, Ramu the keyman set out along the track with his hammer and his bag. The grass was wet with dew and the birds were still sleepy. Tap, tap went his hammer on every rail. ‘Are you strong today?’ he asked each joint. ‘Are you tight today?’ he asked each clip. One clip was a little loose, so Ramu fixed it, gently and firmly, the way you tie a friend’s shoelace. By the time the first train came rushing by, Ramu was standing safely far away from the track, and he smiled. Hundreds of people inside would drink their tea without spilling a single drop, and none of them would ever know why. That was exactly how Ramu liked it.", "Body_hi": "सूरज निकलने से पहले रामू कीमैन अपना हथौड़ा और थैला लेकर पटरी पर निकल पड़ा। घास ओस से भीगी थी और चिड़ियाँ अभी उनींदी थीं। ठक-ठक, उसका हथौड़ा हर पटरी पर बजता। ‘आज मज़बूत हो?’ वह हर जोड़ से पूछता। ‘आज कसे हुए हो?’ वह हर क्लिप से पूछता। एक क्लिप थोड़ी ढीली थी, रामू ने उसे वैसे ही कस दिया जैसे किसी दोस्त का जूता बाँधते हैं। जब पहली ट्रेन दौड़ती हुई आई, रामू पटरी से दूर सुरक्षित खड़ा मुस्कुरा रहा था। अंदर सैकड़ों लोग बिना एक बूँद गिराए चाय पीएँगे, और किसी को पता नहीं चलेगा क्यों। रामू को यही सबसे अच्छा लगता था।", "Body_bn": "সূর্য ওঠার আগেই রামু কিম্যান হাতুড়ি আর ঝোলা নিয়ে লাইন ধরে বেরিয়ে পড়ল। ঘাস শিশিরে ভেজা, পাখিরা তখনও ঘুমঘুম। ঠুক ঠুক, তার হাতুড়ি বাজত প্রতিটি রেলে। ‘আজ শক্ত আছ তো?’ সে জিজ্ঞেস করত প্রতিটি জোড়কে। ‘আজ টাইট আছ তো?’ জিজ্ঞেস করত প্রতিটি ক্লিপকে। একটা ক্লিপ একটু আলগা ছিল, রামু সেটা কষে দিল, বন্ধুর জুতোর ফিতে বাঁধার মতো যত্নে। প্রথম ট্রেন যখন ছুটে এল, রামু লাইন থেকে দূরে নিরাপদে দাঁড়িয়ে হাসছিল। ভিতরে শত শত মানুষ এক ফোঁটাও না ফেলে চা খাবে, আর কেউ জানবেও না কেন। রামুর ঠিক এটাই ভাল লাগত।"}], "KidsQuiz": [{"Q_en": "What does a red signal mean?", "Q_hi": "लाल सिग्नल का क्या अर्थ है?", "Q_bn": "লাল সিগন /* ============ GEO ============ */
var R = 6371000, ROUTE = null;
function rad(x) { return x * Math.PI / 180; }
function prepRoute() {
  var pts = S.data.route; var lat0 = rad(pts[Math.floor(pts.length / 2)].Lat);
  var xy = pts.map(function (p) { return [R * rad(p.Lng) * Math.cos(lat0), R * rad(p.Lat)]; });
  var cum = [0];
  for (var i = 1; i < xy.length; i++) cum.push(cum[i - 1] + Math.hypot(xy[i][0] - xy[i - 1][0], xy[i][1] - xy[i - 1][1]));
  ROUTE = { pts: pts, xy: xy, cum: cum, lat0: lat0, total: cum[cum.length - 1] };
}
function locate(lat, lng) {
  var P = [R * rad(lng) * Math.cos(ROUTE.lat0), R * rad(lat)], best = { d: Infinity, c: 0 };
  for (var i = 0; i < ROUTE.xy.length - 1; i++) {
    var A = ROUTE.xy[i], B = ROUTE.xy[i + 1], dx = B[0] - A[0], dy = B[1] - A[1], L2 = dx * dx + dy * dy;
    var u = L2 ? Math.max(0, Math.min(1, ((P[0] - A[0]) * dx + (P[1] - A[1]) * dy) / L2)) : 0;
    var d = Math.hypot(P[0] - (A[0] + u * dx), P[1] - (A[1] + u * dy));
    if (d < best.d) best = { d: d, c: ROUTE.cum[i] + u * Math.sqrt(L2) };
  }
  return best;
}
function onPos(p) {
  var acc = Math.min(p.coords.accuracy || 0, 2000);
  var r = locate(p.coords.latitude, p.coords.longitude);
  var corridor = Number(setting('CORRIDOR_M', 200)) + Number(setting('ROUTE_TOLERANCE_M', 0));
  var inside = (r.d - acc) <= corridor;
  S.pos = p.coords;
  if (inside) { updateChain(r.c); S.gate = 'ok'; if (!S.unlocked) { S.unlocked = true; render(); } else renderTab(); }
  else if (!S.preview) { S.gate = 'off'; S.offBy = r.d; S.unlocked = false; render(); }
}
function updateChain(c) {
  if (S.lastChain != null && Math.abs(c - S.lastChain) > 300) S.dir = c > S.lastChain ? 1 : -1;
  S.lastChain = c; S.chain = c; stampPassed();
}
function startGeo() {
  if (!navigator.geolocation) { S.gate = 'denied'; render(); return; }
  S.gate = 'wait'; render();
  // enableHighAccuracy:false asks the phone for its network (mobile-tower / Wi-Fi) position
  navigator.geolocation.watchPosition(onPos, function (e) { if (!S.preview) { S.gate = e.code === 1 ? 'denied' : 'wait'; render(); } },
    { enableHighAccuracy: false, maximumAge: 60000, timeout: 30000 });
}
function stationIdx() { // index of the last station passed in direction of travel
  var c = S.chain || 0, cum = ROUTE.cum, i;
  if (S.dir > 0) { for (i = cum.length - 1; i >= 0; i--) if (cum[i] <= c + 500) return i; return 0; }
  for (i = 0; i < cum.length; i++) if (cum[i] >= c - 500) return i; return cum.length - 1;
}
function stampPassed() {
  var c = S.chain, ch = false;
  ROUTE.pts.forEach(function (p, i) {
    if (PASSPORT.indexOf(p.Code) < 0 || S.stamps[p.Code]) return;
    var done = S.dir > 0 ? ROUTE.cum[i] <= c + 1500 : ROUTE.cum[i] >= c - 1500;
    if (done) { S.stamps[p.Code] = new Date().toISOString(); ch = true; }
  });
  if (ch) ls('vbc_stamps', JSON.stringify(S.stamps));
}

function shrink(file) {
  return new Promise(function (res, rej) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.86).split(',')[1]);
    };
    img.onerror = rej; img.src = url;
  });
}

/* ============ CERTIFICATE ============ */
function wrap(ctx, text, x, y, maxW, lh) {
  var words = text.split(' '), line = '', lines = [];
  words.forEach(function (w) { var test = line ? line + ' ' + w : w; if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; });
  lines.push(line); lines.forEach(function (l, i) { ctx.fillText(l, x, y + i * lh); }); return lines.length;
}

  var sans = S.lang === 'bn' ? '"Noto Sans Bengali"' : S.lang === 'hi' ? '"Noto Sans Devanagari"' : 'Inter';
  var draw = function (sig) {
    var x = c.getContext('2d'), W = c.width, H = c.height;
    x.fillStyle = '#FBF7EE'; x.fillRect(0, 0, W, H);
    x.strokeStyle = '#14213D'; x.lineWidth = 10; x.strokeRect(40, 40, W - 80, H - 80);
    x.strokeStyle = '#C47F17'; x.lineWidth = 3; x.strokeRect(66, 66, W - 132, H - 132);
    x.textAlign = 'center'; x.fillStyle = '#8A5A0B'; x.font = '600 24px Inter'; x.fillText('EASTERN RAILWAY  ·  HOWRAH DIVISION  ·  VANDE BHARAT EXPRESS  ·  ' + (S.dir < 0 ? 'NJP – HWH' : 'HWH – NJP'), W / 2, 150);
    x.fillStyle = '#14213D'; x.font = '500 76px ' + serif; x.fillText(t('certTitle'), W / 2, 260);
    x.fillStyle = '#C47F17'; x.fillRect(W / 2 - 120, 292, 240, 4);
    x.fillStyle = '#4A5468'; x.font = '400 30px ' + sans; x.fillText(t('certTo'), W / 2, 370);
    x.fillStyle = '#14213D'; x.font = 'italic 500 84px ' + serif; x.fillText(name, W / 2, 480);
    x.fillStyle = '#2A3142'; x.font = '400 31px ' + sans; wrap(x, t('certBody').replace('{t}', title).replace('{r}', routeName()), W / 2, 570, 1180, 48);
    var d = new Date(), ds = ('0' + d.getDate()).slice(-2) + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + d.getFullYear();
    x.textAlign = 'left'; x.fillStyle = '#4A5468'; x.font = '400 24px Inter';
    x.fillText(t('date') + ': ' + ds, 150, H - 190); x.fillText(t('certNo') + ': ' + certNo, 150, H - 150);
    x.textAlign = 'center';
    if (sig) x.drawImage(sig, W - 520, H - 330, 320, 120 * Math.min(1, sig.height / sig.width * 320 / 120));
    x.strokeStyle = '#14213D'; x.lineWidth = 2; x.beginPath(); x.moveTo(W - 560, H - 200); x.lineTo(W - 160, H - 200); x.stroke();
    x.fillStyle = '#14213D'; x.font = '600 28px Inter'; x.fillText(setting('DRM_NAME', ''), W - 360, H - 160);
    x.fillStyle = '#4A5468'; x.font = '400 21px Inter'; x.fillText(setting('DRM_TITLE', 'Divisional Railway Manager, Howrah'), W - 360, H - 126);
    var m = modal('<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-family:var(--serif);margin:0">' + esc(t('certReady')) + '</h3><button class="iconbtn" data-close aria-label="' + esc(t('close')) + '">' + ic('x') + '</button></div><div id="certbox" style="margin:12px 0"></div><button class="btn saff full" id="c_dl">' + esc(t('download')) + '</button><button class="btn alt full" id="c_sh" style="margin-top:10px">' + esc(t('share')) + '</button>');
    m.querySelector('#certbox').appendChild(c);
    var fname = 'VB-Connect-Certificate-' + certNo + '.png';
    m.querySelector('#c_dl').onclick = function () { var a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = fname; a.click(); };
    m.querySelector('#c_sh').onclick = function () { c.toBlob(function (b) { var file = new File([b], fname, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file], title: t('certTitle') }).catch(function () {});
      else m.querySelector('#c_dl').click(); }); };
  };
  var go = function () { var s = S.data.signature; if (!s) return draw(null); var im = new Image(); im.onload = function () { draw(im); }; im.onerror = function () { draw(null); }; im.src = s; };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(go);
}

/* ============ BOOT ============ */
(function boot() {
  var q = new URLSearchParams(location.search), key = q.get('preview') || (function(){try{return sessionStorage.getItem('vbc_preview')}catch(e){return null}})();
  loadData().then(function () {
    var verify = !key ? Promise.resolve(false) : (!API_URL ? Promise.resolve(key === 'demo') :
      fetch(API_URL + '?action=verify&key=' + encodeURIComponent(key)).then(function (r) { return r.json(); }).then(function (d) { return !!d.ok; }).catch(function () { return false; }));
    return verify;
  }).then(function (ok) {
    if (ok) { S.preview = true; try{sessionStorage.setItem('vbc_preview', key)}catch(e){} S.unlocked = true; updateChain(0); render(); startGeoQuiet(); }
    else render();
  });
  function startGeoQuiet() { if (navigator.geolocation) navigator.geolocation.watchPosition(onPos, function () {}, { enableHighAccuracy: false, maximumAge: 60000, timeout: 30000 }); }
})();
